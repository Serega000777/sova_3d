<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SOVA · PHYSICAL AI</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --panel-2: #1e222b;
        --border: #2a2f3a;
        --text: #e6e8ee;
        --muted: #9aa3b2;
        --accent: #5b9cff;
        --accent-2: #2f6fd6;
        --green: #35c48d;
        --yellow: #e6b84a;
        --red: #ef5d5d;
        --radius: 10px;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: min(520px, 100%);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 22px;
        display: grid;
        gap: 12px;
      }
      h1 { margin: 0; font-size: 20px; }
      p { margin: 0; color: var(--muted); }
      input {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      button {
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid var(--accent-2);
        background: var(--accent-2);
        color: var(--text);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary { background: var(--panel-2); border-color: var(--border); font-weight: 400; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      .error { color: var(--red); }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>SOVA · PHYSICAL AI</h1>
      <p>
        Укажите рабочее пространство, к которому должен подключаться этот компьютер.
        Используйте <code>http://localhost:3100</code>, пока веб-клиент запущен локально,
        или адрес вашего сервера.
      </p>
      <input id="url" spellcheck="false" autocomplete="off" />
      <div class="row">
        <button id="open">Открыть пространство</button>
        <button id="local" class="secondary">Использовать localhost</button>
      </div>
      <p id="status"></p>
    </main>
    <script>
      const LOCAL = "http://localhost:3100";
      const field = document.getElementById("url");
      const status = document.getElementById("status");
      // `invoke` is only present inside the desktop shell; the page also opens in a
      // plain browser during development, where it falls back to a normal navigation.
      const invoke = window.__TAURI__?.core?.invoke;

      async function load() {
        try {
          field.value = invoke ? await invoke("workspace_url") : LOCAL;
        } catch {
          field.value = LOCAL;
        }
      }

      async function open() {
        const url = field.value.trim();
        status.textContent = "";
        status.classList.remove("error");
        if (!url) return;
        try {
          if (invoke) await invoke("open_workspace", { url });
          else window.location.href = url;
        } catch (error) {
          status.textContent = String(error);
          status.classList.add("error");
        }
      }

      document.getElementById("open").addEventListener("click", open);
      document.getElementById("local").addEventListener("click", () => {
        field.value = LOCAL;
        void open();
      });
      field.addEventListener("keydown", (event) => {
        if (event.key === "Enter") void open();
      });
      void load();
    </script>
  </body>
</html>
