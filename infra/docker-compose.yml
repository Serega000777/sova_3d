# Local stack (T-004). Run from repo root: docker compose -f infra/docker-compose.yml up -d
# Host ports default to 1xxxx so the stack coexists with other local projects; override via .env.
name: physical-ai

services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: physicalai
      POSTGRES_PASSWORD: physicalai_dev
      POSTGRES_DB: physicalai
    ports: ["${POSTGRES_PORT:-15432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U physicalai -d physicalai"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports: ["${REDIS_PORT:-16379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO's own images stopped being freely distributable in 2025 (quay.io now 401s
  # anonymous pulls, Docker Hub dropped minio/minio entirely). adobe/s3mock speaks the
  # same S3 REST API (path-style, SigV4 presigned URLs — verified against app/storage.py's
  # boto3 client) and stays on Docker Hub under Adobe's MIT licence. Service name stays
  # "minio" so nothing downstream (env vars, other compose files, docs) has to change.
  minio:
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: physical-ai-dev
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports: ["${MINIO_PORT:-19000}:9090"]
    volumes: ["miniodata:/s3mockroot"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: apply migrations before api/worker start.
  migrate:
    build:
      context: ../services
      dockerfile: api/Dockerfile
      target: api
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://physicalai:physicalai_dev@postgres:5432/physicalai
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9090
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build:
      context: ../services
      dockerfile: api/Dockerfile
      target: api
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://physicalai:physicalai_dev@postgres:5432/physicalai
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9090
    # S3_PUBLIC_ENDPOINT stays as in .env: clients sign against the host-published MinIO port.
    ports: ["${API_PORT:-18000}:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8000/healthz')\""]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ../services
      dockerfile: api/Dockerfile
      target: worker
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://physicalai:physicalai_dev@postgres:5432/physicalai
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9090
    # Needed for `unshare -rn`: parser children run without network (services/worker/README.md).
    cap_add: ["SYS_ADMIN"]
    # F-019: Shap-E's checkpoints (~2.4 GB) survive a container restart instead of
    # re-downloading on the next photo reconstruction.
    volumes: ["shap_e_cache:/app/worker/shap_e_model_cache"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio: { condition: service_healthy }
    restart: unless-stopped

  geometry:
    build: ../services/geometry
    # No network API yet (T-033+); the container just proves the image builds.
    profiles: ["geometry"]

volumes:
  miniodata: {}
  pgdata: {}
  shap_e_cache: {}
