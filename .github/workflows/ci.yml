name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript lint/typecheck/build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  python-api:
    name: Python API lint/type/test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: physicalai
          POSTGRES_PASSWORD: physicalai_dev
          POSTGRES_DB: physicalai_test
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U physicalai -d physicalai_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://physicalai:physicalai_dev@localhost:15432/physicalai_test
      TEST_S3_ENDPOINT: http://localhost:19000
      TEST_S3_BUCKET: physical-ai-dev
      TEST_S3_ACCESS_KEY: physicalai
      TEST_S3_SECRET_KEY: physicalai_dev_secret
    steps:
      - uses: actions/checkout@v4
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 19000:9000             -e MINIO_ROOT_USER=physicalai -e MINIO_ROOT_PASSWORD=physicalai_dev_secret             quay.io/minio/minio:latest server /data
          for i in $(seq 1 30); do curl -sf http://localhost:19000/minio/health/live && break; sleep 1; done
          docker run --rm --network host --entrypoint /bin/sh quay.io/minio/mc:latest             -c "mc alias set local http://localhost:19000 physicalai physicalai_dev_secret && mc mb --ignore-existing local/physical-ai-dev"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra worker
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests alembic
      - run: uv run pytest -q
      - name: API imports without dev dependencies (what the container ships)
        run: uv run --no-dev --frozen python -c "import app.main, app.jobs.runner"
      - name: packages/contracts/openapi.json is up to date
        env:
          DATABASE_URL: postgresql+psycopg://u:p@localhost/x
          REDIS_URL: redis://localhost/0
          S3_ENDPOINT: http://x
          S3_BUCKET: b
          S3_ACCESS_KEY: a
          S3_SECRET_KEY: s
        run: |
          uv run python -m app.cli openapi > /tmp/openapi.json
          diff -q /tmp/openapi.json ../../packages/contracts/openapi.json             || { echo "::error::regenerate with: uv run python -m app.cli openapi > packages/contracts/openapi.json && pnpm --filter @physical-ai/contracts generate"; exit 1; }

  python-worker:
    name: Python worker lint/type/test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy worker tests
      - run: uv run pytest -q -rs

  scanner-bridge:
    name: Scanner bridge lint/type/test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/scanner-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy physical_ai_scanner tests
      - run: uv run pytest -q

  geometry-service:
    name: C++ geometry-service build/test (OCCT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same Debian base as the worker image so the kernel is tested against the OCCT it ships with.
      - run: docker build -t physical-ai-geometry services/geometry
      - run: docker run --rm physical-ai-geometry version

  compose-config:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f infra/docker-compose.yml --env-file .env config --quiet

  containerized-tests:
    name: API suite inside the worker image (real OCCT kernel)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Run tests against compose services
        run: |
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.ci.yml             --env-file .env run --build --rm api-tests
      - name: The API image starts (it must not import worker-only modules)
        run: |
          docker compose -f infra/docker-compose.yml --env-file .env up -d --wait api
      - name: STEP/IGES import against the real kernel (T-022)
        run: |
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.ci.yml             --env-file .env run --rm api-tests             uv run --no-sync pytest -q -rs /app/worker/tests/test_cad_import.py
      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.ci.yml --env-file .env down -v

  desktop-shell:
    name: Tauri desktop shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      # Compiles the shell for this OS; the bundle step is left to the release workflow.
      - run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings

  feature-id:
    name: PR references a Feature ID
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require F-xxx in PR title or body
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s\n%s' "$TITLE" "$BODY" | grep -Eq '\bF-[0-9]{3}\b'; then
            echo "Feature ID found"
          else
            echo "::error::PR title or body must reference a Feature ID (F-001..F-080). Infra-only changes use F-071." >&2
            exit 1
          fi
