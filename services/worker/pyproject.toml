[project]
name = "physical-ai-worker"
version = "0.1.0"
description = "Physical AI 3D Platform — general worker: sandboxed parsing, mesh diagnostics, exports."
requires-python = ">=3.13"
dependencies = [
  "numpy>=2.1",
  "trimesh>=4.5",
  "pydantic>=2.9",
  "lxml>=6.1.3",
  "scipy>=1.18.1",
  "networkx>=3.6.1",
  "rtree>=1.4.1",
  # exact, watertight booleans: cutting models into parts (F-081), fit-test interference
  "manifold3d>=3.5.3",
  "scikit-image>=0.25",
  "shapely>=2.1.2",
  "pycollada>=0.9.3",
  "usd-core>=26.8",
  # F-019: real single-photo reconstruction and F-001 text-to-mesh (worker.shap_e_child), CPU-only.
  # shap-e itself is unpublished on PyPI and pinned straight to a commit (see tool.uv.sources).
  "torch>=2.14",
  # direct, so it comes from the same CPU index as torch: the PyPI Linux wheel is built
  # for CUDA torch and fails at runtime with "operator torchvision::nms does not exist"
  "torchvision>=0.29",
  "shap-e",
  "pyyaml>=6.0",  # shap_e.diffusion.gaussian_diffusion imports it but does not declare it
  "xatlas>=0.0.11",
  "fast-simplification>=0.2.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
shap-e = { git = "https://github.com/openai/shap-e.git", rev = "50131012ee11c9d2617f3886c10f000d3c7a3b43" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "mypy>=1.11",
  "lxml-stubs>=0.5.1",
  "types-shapely>=2.1.0.20260728",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
include = ["worker/py.typed"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.ruff.lint.isort]
known-first-party = ["worker", "tests"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["trimesh", "trimesh.*", "scipy", "scipy.*", "collada", "collada.*", "pxr", "pxr.*",
          "shap_e", "shap_e.*"]
ignore_missing_imports = true

# trimesh is only partially annotated; calling its untyped methods is unavoidable here.
[[tool.mypy.overrides]]
module = ["worker.exporters", "worker.repair", "worker.printcheck", "worker.paint",
          "worker.engineering", "worker.fit", "worker.reconstruction", "worker.generate_mesh",
          "worker.gameready",
          "worker.splitting",
          "worker.importers.*", "worker.shap_e_child", "tests.fixtures"]
disable_error_code = ["no-untyped-call"]

[tool.pytest.ini_options]
testpaths = ["tests"]
