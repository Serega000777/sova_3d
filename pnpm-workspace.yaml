packages:
  - 'apps/*'
  - 'apps/mobile/modules/*'
  - 'packages/*'
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.26 || 57.0.29'
  - '@expo/metro-runtime@57.0.16'
  - '@expo/ui@57.0.19 || 57.0.21 || 57.0.23'
  - expo-asset@57.0.18
  - expo-constants@57.0.19 || 57.0.20
  - expo-router@57.0.22 || 57.0.24 || 57.0.26
  - expo@57.0.24 || 57.0.26 || 57.0.28
  - expo-image-picker@57.0.19
  - expo-modules-core@57.0.20 || 57.0.22
  - expo-camera@57.0.6
  - '@expo/fingerprint@0.20.14'
  - '@expo/inline-modules@0.1.8'
  - '@expo/local-build-cache-provider@57.0.9'
  - '@expo/prebuild-config@57.0.18'
  - babel-preset-expo@57.0.15
  - expo-modules-autolinking@57.0.15
  - expo-modules-jsi@57.1.2
  - expo-dev-client@57.0.20
  - expo-dev-launcher@57.0.21
  - expo-dev-menu@57.0.20

# React Native's toolchain (Metro, Expo, react-native-web) resolves transitive
# dependencies as if node_modules were flat, so install the whole workspace that way.
# Expo documents this as the supported pnpm layout for monorepos.
nodeLinker: hoisted

patchedDependencies:
  expo-camera@57.0.6: patches/expo-camera@57.0.6.patch
