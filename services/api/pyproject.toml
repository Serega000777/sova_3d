[project]
name = "physical-ai-api"
version = "0.1.0"
description = "Physical AI 3D Platform — orchestration/API service (FastAPI)."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "boto3>=1.35",
  "httpx>=0.27",
  "anthropic>=1",
]

[project.optional-dependencies]
# Job runner process (`python -m app.jobs.runner`): pulls in the compute library.
worker = ["physical-ai-worker"]

[tool.uv.sources]
physical-ai-worker = { path = "../worker", editable = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "boto3-stubs[s3]>=1.43.93",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint.isort]
# The local ./alembic directory must not shadow the alembic package.
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]
