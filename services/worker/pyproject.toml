[project]
name = "physical-ai-worker"
version = "0.1.0"
description = "Physical AI 3D Platform — general worker: sandboxed parsing, mesh diagnostics, exports."
requires-python = ">=3.13"
dependencies = [
  "numpy>=2.1",
  "trimesh>=4.5",
  "pydantic>=2.9",
  "lxml>=6.1.3",
  "scipy>=1.18.1",
  "networkx>=3.6.1",
  "rtree>=1.4.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "mypy>=1.11",
  "lxml-stubs>=0.5.1",
  "manifold3d>=3.5.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
include = ["worker/py.typed"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.ruff.lint.isort]
known-first-party = ["worker", "tests"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["trimesh", "trimesh.*"]
ignore_missing_imports = true

# trimesh is only partially annotated; calling its untyped methods is unavoidable here.
[[tool.mypy.overrides]]
module = ["worker.exporters", "worker.repair", "worker.printcheck", "worker.paint",
          "worker.reconstruction", "worker.importers.*", "tests.fixtures"]
disable_error_code = ["no-untyped-call"]

[tool.pytest.ini_options]
testpaths = ["tests"]
